<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>אישור הגעה</title>
<style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#121a2e;--line:#27334d;--text:#f3f6ff;--muted:#aab5cc;--accent:#8b9cff;--good:#78e0b0;--bad:#ff9b9b}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#182442,var(--bg) 60%);color:var(--text);font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:22px}.wrap{width:min(680px,100%)}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:800;font-size:18px}.link{background:transparent;border:1px solid var(--line);color:var(--muted);padding:9px 12px;border-radius:11px;cursor:pointer}.card{background:rgba(18,26,46,.95);border:1px solid var(--line);border-radius:22px;padding:clamp(20px,5vw,34px);box-shadow:0 20px 80px #0005}h1{font-size:clamp(28px,6vw,38px);margin:0 0 8px}p{color:var(--muted);line-height:1.6;margin-top:0}.field{margin-top:17px}label{display:block;margin-bottom:8px;font-weight:700}input,select,textarea{width:100%;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:#0b1224;color:var(--text);font:inherit;outline:none}input:focus,select:focus,textarea:focus{border-color:var(--accent)}.choices{display:flex;gap:10px}.choice{flex:1;display:flex;align-items:center;gap:9px;padding:13px;border:1px solid var(--line);border-radius:12px;cursor:pointer}.choice input{width:auto}.primary{width:100%;border:0;border-radius:13px;padding:14px;margin-top:22px;background:var(--accent);color:#11172a;font-weight:800;font-size:16px;cursor:pointer}.primary:disabled{opacity:.55;cursor:wait}.msg{margin-top:14px;padding:12px;border-radius:12px;display:none}.msg.show{display:block}.ok{background:#15372e;color:#a7f2cf}.err{background:#401f2a;color:#ffc0c0}.hidden{display:none!important}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.stat{background:#0b1224;border:1px solid var(--line);border-radius:14px;padding:14px}.stat small{display:block;color:var(--muted)}.stat strong{font-size:26px;display:block;margin-top:5px}.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:12px}table{width:100%;border-collapse:collapse;min-width:480px}th,td{text-align:right;padding:12px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-size:13px}tr:last-child td{border-bottom:0}.pill{padding:5px 9px;border-radius:999px;background:#173a30;color:var(--good);font-size:12px}.pill.no{background:#3b222b;color:var(--bad)}.small{font-size:12px;color:var(--muted);margin-top:14px}@media(max-width:460px){.stats{grid-template-columns:1fr 1fr}.stat:last-child{grid-column:span 2}.choices{flex-direction:column}}
</style></head>
<body><main class="wrap">
<div class="top"><div class="brand">✦ אישור הגעה</div><button class="link" id="adminLink" type="button">אזור מנהל 🔒</button></div>
<section class="card" id="rsvpView"><h1>מגיעים? 🎉</h1><p>מלאו את הפרטים כדי לאשר הגעה.</p>
<form id="rsvpForm"><div class="field"><label for="name">שם מלא</label><input id="name" name="name" required maxlength="100" autocomplete="name" placeholder="איך קוראים לך?"></div>
<div class="field"><label>האם תגיעו?</label><div class="choices"><label class="choice"><input type="radio" name="status" value="yes" checked> כן, מגיע/ה</label><label class="choice"><input type="radio" name="status" value="no"> לא אוכל להגיע</label></div></div>
<div class="field" id="guestsField"><label for="guests">מספר אנשים כולל אותך</label><select id="guests" name="guests"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option>7</option><option>8</option><option>9</option><option>10</option></select></div>
<div class="field"><label for="note">הערה (לא חובה)</label><textarea id="note" name="note" rows="3" maxlength="500" placeholder="הערה קצרה..."></textarea></div>
<button class="primary" id="submitBtn">שליחת אישור הגעה</button><div class="msg" id="formMsg" role="status"></div></form><div class="small">המידע נשלח באופן מאובטח ונגיש למנהל בלבד.</div></section>
<section class="card hidden" id="loginView"><h1>אזור מנהל 🔒</h1><p>התחבר כדי לראות את רשימת האישורים.</p><form id="loginForm"><div class="field"><label for="password">סיסמת מנהל</label><input id="password" type="password" required autocomplete="current-password" placeholder="הקלד סיסמה"></div><button class="primary">כניסה</button><div class="msg" id="loginMsg" role="status"></div></form><button class="link" id="backBtn" style="margin-top:14px">חזרה לטופס</button></section>
<section class="card hidden" id="dashboardView"><div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><div><h1>ניהול אישורי הגעה</h1><p style="margin-bottom:0">רק מנהל מחובר יכול לראות את הרשימה.</p></div><button class="link" id="logoutBtn">התנתקות</button></div><div class="stats"><div class="stat"><small>אישרו הגעה</small><strong id="yesCount">0</strong></div><div class="stat"><small>לא מגיעים</small><strong id="noCount">0</strong></div><div class="stat"><small>סה״כ אנשים שמגיעים</small><strong id="peopleCount">0</strong></div></div><div style="display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap"><button class="link" id="refreshBtn">רענון רשימה ↻</button><button class="link" id="csvBtn">ייצוא CSV</button></div><div class="tablewrap"><table><thead><tr><th>שם</th><th>תשובה</th><th>אנשים</th><th>הערה</th><th>תאריך</th></tr></thead><tbody id="rows"></tbody></table></div><div class="msg" id="dashMsg" role="status"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);let adminPassword='';let records=[];
function show(view){['rsvpView','loginView','dashboardView'].forEach(id=>$(id).classList.toggle('hidden',id!==view));}
function message(id,text,kind){const el=$(id);el.textContent=text;el.className='msg show '+kind;}
$('adminLink').onclick=()=>{show('loginView');$('loginMsg').className='msg';};$('backBtn').onclick=()=>show('rsvpView');
document.querySelectorAll('input[name="status"]').forEach(el=>el.addEventListener('change',()=>{$('guestsField').classList.toggle('hidden',document.querySelector('input[name="status"]:checked').value==='no');}));
$('rsvpForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('submitBtn');btn.disabled=true;btn.textContent='שולח...';const status=document.querySelector('input[name="status"]:checked').value;const data={name:$('name').value.trim(),status,guests:status==='yes'?Number($('guests').value):0,note:$('note').value.trim()};try{const r=await fetch('/api/rsvp',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const j=await r.json();if(!r.ok)throw Error(j.error||'לא ניתן לשלוח כרגע');message('formMsg','תודה! התשובה שלך נשמרה בהצלחה.','ok');$('rsvpForm').reset();$('guestsField').classList.remove('hidden');}catch(err){message('formMsg','לא הצלחנו לשמור את התשובה. בדקו שהאתר הוגדר לפי הוראות ההתקנה.','err');}finally{btn.disabled=false;btn.textContent='שליחת אישור הגעה';}});
$('loginForm').addEventListener('submit',async e=>{e.preventDefault();adminPassword=$('password').value;try{await loadRecords();$('password').value='';show('dashboardView');}catch(err){adminPassword='';message('loginMsg','סיסמה שגויה או שיש בעיה בחיבור.','err');}});
async function loadRecords(){const r=await fetch('/api/rsvp',{headers:{'x-admin-password':adminPassword}});const j=await r.json();if(!r.ok)throw Error(j.error||'Login failed');records=j.records||[];render();}
function render(){const yes=records.filter(x=>x.status==='yes');$('yesCount').textContent=yes.length;$('noCount').textContent=records.length-yes.length;$('peopleCount').textContent=yes.reduce((n,x)=>n+(Number(x.guests)||1),0);$('rows').innerHTML='';if(!records.length){$('rows').innerHTML='<tr><td colspan="5">עדיין אין תשובות.</td></tr>';return;}for(const x of records){const tr=document.createElement('tr');const vals=[x.name,x.status==='yes'?'מגיע/ה':'לא מגיע/ה',x.status==='yes'?x.guests:0,x.note||'',x.created_at?new Date(x.created_at).toLocaleString('he-IL'): ''];vals.forEach((v,i)=>{const td=document.createElement('td');if(i===1){const span=document.createElement('span');span.className='pill'+(x.status==='no'?' no':'');span.textContent=v;td.append(span);}else td.textContent=v;tr.append(td);});$('rows').append(tr);}}
$('refreshBtn').onclick=async()=>{try{await loadRecords();message('dashMsg','הרשימה עודכנה.','ok');}catch(e){message('dashMsg','לא ניתן לרענן. התחבר מחדש.','err');}};
$('logoutBtn').onclick=()=>{adminPassword='';records=[];show('loginView');};$('csvBtn').onclick=()=>{const data=[['שם','תשובה','מספר אנשים','הערה','תאריך'],...records.map(x=>[x.name,x.status==='yes'?'מגיע/ה':'לא מגיע/ה',x.guests,x.note,x.created_at])];const csv='\uFEFF'+data.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='rsvp-responses.csv';a.click();URL.revokeObjectURL(a.href);};
</script></body></html>
